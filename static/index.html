<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vin-rouge 酒类分销</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F5F6F8;color:#202939;font-size:14px}
header{background:#7b1e26;color:#fff;padding:10px 14px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
header button{background:#fff;color:#7b1e26;border:0;border-radius:8px;padding:6px 12px;font-size:13px}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #EAECF0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
h2{margin:0 0 10px;font-size:16px;font-weight:600} h3{margin:12px 0 6px;font-size:14px;font-weight:600;color:#202939}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;border:1px solid #EAECF0;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px;color:#7b1e26}
.stat span{color:#667085;font-size:12px}
.bigbtn{display:block;width:100%;padding:10px;font-size:15px;border:0;border-radius:8px;background:#7b1e26;color:#fff;margin-bottom:8px}
button{padding:9px 16px;font-size:14px;border-radius:8px;border:0;background:#7b1e26;color:#fff;cursor:pointer}
button:active{background:#5f1620}
button.ghost{background:#F2F3F5;color:#202939}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #EAECF0;border-radius:8px;margin:6px 0}
label{font-size:13px;color:#667085}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #EAECF0;padding:6px 4px;text-align:left}
.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #F0F2F5;padding:8px 0}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#eee}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.nav button{flex:1;min-width:64px;padding:8px 6px;font-size:13px;background:#F2F3F5;color:#202939;border-radius:999px}
.hidden{display:none}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:6px;padding:1px 6px;font-size:10px}
.badge.warn{background:#ffecb3;color:#7a5c00}
.muted{color:#98A2B3;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:#202939;color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<header><span>🍷 vin-rouge</span><span><span id="who"></span> <button id="logoutBtn" class="hidden" onclick="logout(this)">退出</button></span></header>
<main>
<!-- 登录 -->
<div id="page-login" class="card hidden"><h2>登录</h2>
<label>用户名</label><input id="login-user" placeholder="用户名">
<label>密码</label><input id="login-pw" type="password" placeholder="密码">
<button onclick="doLogin()">登录</button>
<p class="muted">首次使用请先注册首位管理员，注册后即关闭注册。</p>
<p class="muted">当前版本 <span id="login-ver">…</span></p></div>
<!-- 首次注册首位管理员（仅无用户时显示） -->
<div id="page-register" class="card hidden"><h2>注册首位管理员</h2>
<label>用户名</label><input id="reg-user" placeholder="用户名">
<label>密码（至少6位）</label><input id="reg-pw" type="password" placeholder="密码">
<button onclick="doRegister()">注册并进入</button>
<p class="muted">第一个注册的为管理员，注册后关闭注册，后续管理员由该管理员在“用户管理”里生成。</p></div>
<!-- 改密 -->
<div id="page-chpw" class="card hidden"><h2>首次登录，请修改密码</h2>
<label>原密码</label><input id="old-pw" type="password">
<label>新密码（至少6位）</label><input id="new-pw" type="password">
<button onclick="doChangePw()">修改并进入</button></div>

<div id="app" class="hidden">
<div class="nav">
<button onclick="show('home')">首页</button><button onclick="show('inbound')">进货</button>
<button onclick="show('opening')">补登</button><button onclick="show('outbound')">出货</button>
<button onclick="show('transfer')">调拨</button><button onclick="show('wines')">酒库</button>
<button onclick="show('suppliers')">供应商</button><button onclick="show('customers')">客户</button>
<button onclick="show('orders')">单据</button><button onclick="show('users')">用户管理</button>
<button onclick="show('audit')">操作记录</button>
</div>

<div id="page-home"><div class="grid" id="stats"></div>
<div class="card"><h3>低库存提醒（&lt;5 瓶）</h3><div id="lowstock"></div></div>
<button class="bigbtn" onclick="show('inbound')">＋ 进货</button>
<button class="bigbtn" onclick="show('opening')">＋ 库存补登</button>
<button class="bigbtn" onclick="show('outbound')">＋ 出货</button>
<button class="bigbtn" onclick="show('transfer')">⇄ 调拨</button></div>

<div id="page-wines" class="hidden"><div class="card"><h2>酒库</h2>
<label>条码</label><input id="w-barcode" placeholder="扫码或输入条码"><button class="ghost" onclick="lookupBarcode()">扫条码查网上信息</button>
<label>酒名 *</label><input id="w-name"><label>品牌</label><input id="w-brand">
<label>规格（如 750ml*6瓶/箱）</label><input id="w-spec">
<label>产地</label><input id="w-origin"><label>厂家</label><input id="w-manu">
<label>说明</label><textarea id="w-desc"></textarea>
<label>图片（拍照或相册，≤5MB）</label><input id="w-img" type="file" accept="image/*">
<button onclick="saveWine()">保存酒</button><p id="w-msg" class="muted"></p></div>
<div class="card"><h3>酒列表</h3><div id="wine-list"></div></div></div>

<div id="page-suppliers" class="hidden"><div class="card"><h2>供应商</h2><div id="sup-list"></div>
<label>名称 *</label><input id="s-name">
<label>电话</label><input id="s-phone"><label>地址</label><input id="s-addr">
<button id="s-save-btn" onclick="saveParty('suppliers')">新增供应商</button><button class="ghost hidden" id="s-cancel-btn" onclick="cancelEditParty()">取消修改</button></div></div>

<div id="page-customers" class="hidden"><div class="card"><h2>客户</h2><div id="cus-list"></div>
<label>名称 *</label><input id="c-name">
<label>电话</label><input id="c-phone"><label>地址</label><input id="c-addr">
<button id="c-save-btn" onclick="saveParty('customers')">新增客户</button><button class="ghost hidden" id="c-cancel-btn" onclick="cancelEditParty()">取消修改</button></div></div>

<div id="page-inbound" class="hidden"><div class="card"><h2>进货单</h2>
<label>供应商</label><select id="in-sup"></select>
<label>仓库</label><select id="in-wh"></select>
<label>酒</label><select id="in-wine"></select>
<label>数量（瓶）</label><input id="in-qty" type="number" value="1">
<label>进价（元/瓶）</label><input id="in-price" type="number" step="0.01">
<label>物流公司</label><input id="in-carrier"><label>物流单号</label><input id="in-track">
<label>运费（元）</label><input id="in-freight" type="number" step="0.01" value="0">
<label><input type="checkbox" id="in-free" style="width:auto"> 包邮（运费记 0）</label>
<label>谁付运费</label><input id="in-payer" placeholder="如：我方 / 供应商">
<label>本次已付货款（元，可 0）</label><input id="in-paid" type="number" step="0.01" value="0">
<label>备注</label><input id="in-note">
<button onclick="submitInbound()">提交进货</button><p id="in-msg"></p></div></div>

<div id="page-opening" class="hidden"><div class="card"><h2>库存补登（期初）</h2>
<label>仓库</label><select id="op-wh"></select>
<label>酒</label><select id="op-wine"></select>
<label>数量（瓶）</label><input id="op-qty" type="number" value="1">
<label>成本价（元/瓶，可空）</label><input id="op-price" type="number" step="0.01">
<label>批次（可空）</label><input id="op-batch">
<label>日期（可回填）</label><input id="op-date" type="date">
<label>备注</label><input id="op-note">
<button onclick="submitOpening()">提交补登</button><p id="op-msg"></p></div></div>

<div id="page-outbound" class="hidden"><div class="card"><h2>出货单</h2>
<label>出库类型</label><select id="out-type" onchange="outTypeChanged()">
<option value="sale">销售出库</option><option value="personal">自饮</option>
<option value="gift">赠送</option><option value="damage">破损</option></select>
<label>日期</label><input id="out-date" type="date">
<label>客户</label><select id="out-cus"></select>
<label>仓库</label><select id="out-wh"></select>
<label>酒</label><select id="out-wine"></select>
<label>数量（瓶）</label><input id="out-qty" type="number" value="1">
<label>卖价（元/瓶）</label><input id="out-price" type="number" step="0.01">
<div id="out-discount">
<label>折扣率（如 0.9 为 9 折，留空不打折）</label><input id="out-rate" type="number" step="0.01" min="0" max="1">
<label>折后单价（元/瓶，与折扣率二选一，填了就按这个算）</label><input id="out-dprice" type="number" step="0.01">
<label>瑕疵/打折原因（打折必填，如瓶身划痕、包装破损）</label><input id="out-reason">
</div>
<label>物流公司</label><input id="out-carrier"><label>物流单号</label><input id="out-track">
<label>运费（元）</label><input id="out-freight" type="number" step="0.01" value="0">
<label><input type="checkbox" id="out-free" style="width:auto"> 包邮（运费记 0）</label>
<label>谁付运费</label><input id="out-payer" placeholder="如：我方 / 客户">
<label>本次已收货款（元，可 0）</label><input id="out-paid" type="number" step="0.01" value="0">
<label>备注</label><input id="out-note">
<button onclick="submitOutbound()">提交出货</button><p id="out-msg"></p></div></div>

<div id="page-transfer" class="hidden"><div class="card"><h2>调拨</h2>
<label>酒</label><select id="tr-wine"></select>
<label>从仓库</label><select id="tr-from"></select>
<label>到仓库</label><select id="tr-to"></select>
<label>数量（瓶）</label><input id="tr-qty" type="number" value="1">
<button onclick="submitTransfer()">一键调拨</button><p id="tr-msg"></p></div></div>

<div id="page-orders" class="hidden"><div class="card"><h2>单据</h2>
<button class="ghost" onclick="loadOrders('inbound')">进货/补登单</button>
<button class="ghost" onclick="loadOrders('outbound')">出货单</button>
<button class="ghost" onclick="loadOrders('transfers')">调拨单</button>
<div id="order-list"></div>
<div id="order-detail"></div></div></div>

<div id="page-users" class="hidden"><div class="card"><h2>用户管理（所有管理员权限相同）</h2>
<div id="user-list"></div>
<label>用户名 *</label><input id="u-name"><label>显示名</label><input id="u-disp">
<label>密码 *</label><input id="u-pw" type="password">
<button onclick="saveUser()">新增管理员</button></div></div>

<div id="page-audit" class="hidden"><div class="card"><h2>操作记录</h2><div id="audit-list"></div></div></div>
</div>
<footer class="muted" style="text-align:center;padding:8px 0 16px">vin-rouge <span id="ver">…</span></footer>
</main>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('vr_token')||'';
let me=localStorage.getItem('vr_user')||'';
let toastTimer=null;
function showToast(msg){const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
let _pend=0,_lastBtn=null,_lastTxt='';
const _fetch=window.fetch.bind(window);
window.fetch=async(...a)=>{_pend++;try{return await _fetch(...a);}finally{_pend--;if(_pend<=0){_pend=0;if(_lastBtn){_lastBtn.disabled=false;_lastBtn.textContent=_lastTxt;_lastBtn=null;}}}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.closest('a')||b.id==='logoutBtn')return;_lastBtn=b;_lastTxt=b.textContent;b.disabled=true;b.textContent='处理中…';setTimeout(()=>{if(_pend<=0&&_lastBtn===b){b.disabled=false;b.textContent=_lastTxt;_lastBtn=null;}},120);});
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:headers(),body:body?JSON.stringify(body):undefined});if(r.status===401){logout();throw new Error('未登录')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||('请求失败 '+r.status));return d}
function show(p){['home','wines','suppliers','customers','inbound','opening','outbound','transfer','orders','users','audit'].forEach(x=>$('page-'+x).classList.toggle('hidden',x!==p));if(p==='home')loadHome();if(p==='wines')loadWines();if(p==='suppliers')loadParties('suppliers');if(p==='customers')loadParties('customers');if(p==='users')loadUsers();if(p==='audit')loadAudit();if(['inbound','opening','outbound','transfer'].includes(p))loadFormOptions();}
async function doRegister(){try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('reg-user').value,password:$('reg-pw').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail);token=d.token;me=d.username;localStorage.setItem('vr_token',token);localStorage.setItem('vr_user',me);enterApp();}catch(e){alert(e.message)}}
async function loadAuthStatus(){try{const r=await fetch('/api/auth/status');const d=await r.json();if(d.registration_open){$('page-login').classList.add('hidden');$('page-register').classList.remove('hidden');}}catch(e){}}
async function doLogin(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('login-user').value,password:$('login-pw').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail);token=d.token;me=d.username;localStorage.setItem('vr_token',token);localStorage.setItem('vr_user',me);if(d.must_change_password){$('page-login').classList.add('hidden');$('page-chpw').classList.remove('hidden');}else enterApp();}catch(e){alert(e.message)}}
async function doChangePw(){try{await fetch('/api/change-password',{method:'POST',headers:headers(),body:JSON.stringify({old_password:$('old-pw').value,new_password:$('new-pw').value})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail)});$('page-chpw').classList.add('hidden');enterApp();}catch(e){alert(e.message)}}
function enterApp(){$('page-login').classList.add('hidden');$('page-register').classList.add('hidden');$('page-chpw').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('who').textContent=me;show('home');}
function logout(btn){if(btn){btn.disabled=true;btn.textContent='正在退出…';showToast('正在退出…');}token='';localStorage.removeItem('vr_token');localStorage.removeItem('vr_user');setTimeout(()=>location.reload(),350);}
async function loadHome(){const d=await api('/api/dashboard');$('stats').innerHTML=`<div class="stat"><span>今天销售额</span><b>¥${d.today_sales}</b></div><div class="stat"><span>今天毛利估算</span><b>¥${d.today_profit}</b></div><div class="stat"><span>客户欠款合计</span><b>¥${d.customer_debt}</b></div><div class="stat"><span>供应商欠款合计</span><b>¥${d.supplier_debt}</b></div><div class="stat"><span>本月自饮</span><b>${d.month_personal_qty} 瓶 / ¥${d.month_personal_cost}</b></div><div class="stat"><span>本月赠送</span><b>${d.month_gift_qty} 瓶 / ¥${d.month_gift_cost}</b></div><div class="stat"><span>本月破损</span><b>${d.month_damage_qty} 瓶 / ¥${d.month_damage_cost}</b></div><div class="stat"><span>本月折扣</span><b>¥${d.month_discount_total}</b></div>`;$('lowstock').innerHTML=d.low_stock.length?d.low_stock.map(w=>`<div>${w.name} ${w.spec||''}：仅剩 ${w.qty} 瓶 <span class="badge warn">低库存</span></div>`).join(''):'暂无低库存酒';}
async function loadWines(){const ws=await api('/api/wines');$('wine-list').innerHTML=ws.map(w=>`<div class="item">${w.image_path?`<img src="/${w.image_path}">`:'<div style="width:64px;height:64px;background:#eee;border-radius:8px"></div>'}<div><b>${w.name}</b> <span class="muted">${w.spec||''} ${w.brand||''}</span><br><span class="muted">条码 ${w.barcode||'-'} · 库存合计 ${w.stock_total} 瓶</span><br><span class="muted">${w.description||''}</span></div></div>`).join('')||'暂无酒';}
async function lookupBarcode(){const code=$('w-barcode').value.trim();if(!code)return alert('先填条码');const d=await api('/api/barcode?code='+encodeURIComponent(code));if(!d.found){$('w-msg').textContent='网上查不到，请手填一次存本地库，下次直接用。';return}if(d.source==='local'){$('w-msg').textContent='本地库已有该条码，已自动填入。';}$('w-name').value=d.name||'';$('w-brand').value=d.brand||'';$('w-spec').value=d.spec||'';$('w-origin').value=d.origin||'';$('w-manu').value=d.manufacturer||'';$('w-msg').textContent='已自动带回信息，请核对后保存。';}
async function saveWine(){const b={barcode:$('w-barcode').value.trim()||null,name:$('w-name').value.trim(),brand:$('w-brand').value,spec:$('w-spec').value,origin:$('w-origin').value,manufacturer:$('w-manu').value,description:$('w-desc').value};const d=await api('/api/wines','POST',b);const f=$('w-img').files[0];if(f){await fetch(`/api/wines/${d.id}/image`,{method:'POST',headers:{'Authorization':'Bearer '+token,'X-Filename':f.name},body:f});}$('w-msg').textContent='已保存';showToast('已保存');loadWines();}
async function loadParties(kind){const ps=await api('/api/'+kind);const el=kind==='suppliers'?$('sup-list'):$('cus-list');el.innerHTML=ps.map(p=>`<div class="item"><div><b>${p.name}</b> <span class="muted">${p.phone||''}</span><br>欠款余额 ¥${p.balance}${kind==='customers'&&p.gift_qty?` · 累计获赠 ${p.gift_qty} 瓶（成本 ¥${p.gift_cost}）`:''} ${p.active?'':'<span class="badge warn">已停用</span>'} ${p.active?`<button class="ghost" onclick="toggleParty('${kind}',${p.id},0)">停用</button>`:''}<button class="ghost" onclick="editParty('${kind}',${p.id})">修改</button><button class="ghost" onclick="delParty('${kind}',${p.id})">删除</button></div></div>`).join('')||'暂无';}
async function toggleParty(kind,id,active){try{await api(`/api/${kind}/${id}`,'PUT',{active});loadParties(kind);loadFormOptions();showToast(active?'已启用':'已停用');}catch(e){showToast('失败：'+e.message);}}
async function saveParty(kind){const isEdit=editPartyKind===kind&&editPartyId;const p=kind==='suppliers'?{name:$('s-name').value,phone:$('s-phone').value,address:$('s-addr').value}:{name:$('c-name').value,phone:$('c-phone').value,address:$('c-addr').value};try{if(isEdit){await api('/api/'+kind+'/'+editPartyId,'PUT',p);showToast('已更新');}else{await api('/api/'+kind,'POST',p);showToast(kind==='suppliers'?'供应商已新增':'客户已新增');}cancelEditParty();loadParties(kind);loadFormOptions();}catch(e){showToast('失败：'+e.message);}}
async function loadFormOptions(){const [wh,wines,sups,cuss]=await Promise.all([api('/api/warehouses'),api('/api/wines'),api('/api/suppliers'),api('/api/customers')]);const whO=wh.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');const wO=wines.map(w=>`<option value="${w.id}">${w.name} ${w.spec||''}（库存${w.stock_total}）</option>`).join('');['in-wh','op-wh','out-wh','tr-from','tr-to'].forEach(id=>$(id).innerHTML=whO);['in-wine','op-wine','out-wine','tr-wine'].forEach(id=>$(id).innerHTML=wO);$('in-sup').innerHTML=sups.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');$('out-cus').innerHTML=cuss.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');}
async function submitInbound(){try{const d=await api('/api/inbound','POST',{type:'purchase',supplier_id:+$('in-sup').value,warehouse_id:+$('in-wh').value,carrier:$('in-carrier').value,tracking_no:$('in-track').value,freight:+$('in-freight').value||0,freight_free:$('in-free').checked,freight_payer:$('in-payer').value,paid_amount:+$('in-paid').value||0,note:$('in-note').value,items:[{wine_id:+$('in-wine').value,qty:+$('in-qty').value,unit_price:+$('in-price').value||0}]});$('in-msg').textContent='已生成进货单 '+d.order_no;showToast('已生成进货单 '+d.order_no);}catch(e){$('in-msg').textContent='失败：'+e.message;showToast('失败：'+e.message);}}
async function submitOpening(){try{const d=await api('/api/inbound','POST',{type:'opening',warehouse_id:+$('op-wh').value,order_date:$('op-date').value||undefined,batch:$('op-batch').value,paid_amount:0,note:$('op-note').value,items:[{wine_id:+$('op-wine').value,qty:+$('op-qty').value,unit_price:+$('op-price').value||0,batch:$('op-batch').value}]});$('op-msg').textContent='已生成补登单 '+d.order_no;showToast('已生成补登单 '+d.order_no);}catch(e){$('op-msg').textContent='失败：'+e.message;showToast('失败：'+e.message);}}
function outTypeChanged(){const t=$('out-type').value;$('out-discount').classList.toggle('hidden',t!=='sale');}
async function submitOutbound(){try{const typ=$('out-type').value;const rate=$('out-rate').value.trim(),dprice=$('out-dprice').value.trim(),reason=$('out-reason').value.trim();if(typ==='gift'&&!$('out-cus').value)throw new Error('赠送必须选择客户');if(typ==='sale'&&(rate||dprice)&&!reason&&!$('out-note').value.trim())throw new Error('打折需填写瑕疵/打折原因');const item={wine_id:+$('out-wine').value,qty:+$('out-qty').value,unit_price:+$('out-price').value||0};if(typ==='sale'){item.orig_price=item.unit_price;if(rate)item.discount_rate=+rate;if(dprice)item.discount_price=+dprice;if(reason)item.reason=reason;}const d=await api('/api/outbound','POST',{type:typ,customer_id:(typ==='sale'||typ==='gift')?+$('out-cus').value:undefined,warehouse_id:+$('out-wh').value,order_date:$('out-date').value||undefined,carrier:$('out-carrier').value,tracking_no:$('out-track').value,freight:+$('out-freight').value||0,freight_free:$('out-free').checked,freight_payer:$('out-payer').value,paid_amount:+$('out-paid').value||0,note:$('out-note').value,items:[item]});$('out-msg').textContent='已生成单据 '+d.order_no+(d.discount_total?'（折扣 ¥'+d.discount_total+'）':'');showToast('已生成单据 '+d.order_no);}catch(e){$('out-msg').textContent='失败：'+e.message;showToast('失败：'+e.message);}}
async function submitTransfer(){try{const d=await api('/api/transfers','POST',{wine_id:+$('tr-wine').value,from_warehouse_id:+$('tr-from').value,to_warehouse_id:+$('tr-to').value,qty:+$('tr-qty').value});$('tr-msg').textContent='调拨完成 '+d.transfer_no;showToast('调拨完成 '+d.transfer_no);}catch(e){$('tr-msg').textContent='失败：'+e.message;showToast('失败：'+e.message);}}
async function loadOrders(kind){let ds;if(kind==='transfers')ds=await api('/api/transfers');else ds=await api('/api/'+kind);$('order-list').innerHTML=ds.map(o=>{const no=o.order_no||o.transfer_no;const tot=o.sale_total??o.goods_total??'';const tlabel=o.type==='personal'?'自饮':o.type==='gift'?'赠送':o.type==='damage'?'破损':o.type==='opening'?'补登':'';const canShare=kind==='inbound'||o.type==='sale';return `<div class="item"><div><b>${no}</b> <span class="muted">${o.order_date||o.created_at||''} ${tlabel}</span><br>金额 ¥${tot} · 已付 ¥${o.paid_amount??''} · ${o.pay_status||''} ${kind!=='transfers'?`<button class="ghost" onclick="showOrder('${kind}',${o.id})">详情/补记付款</button> ${canShare?`<a href="/api/orders/${kind==='inbound'?'inbound':'outbound'}/${o.id}/share.png" target="_blank" onclick="showToast('正在生成分享图…')"><button class="ghost">分享图</button></a>`:''}`:''}</div></div>`}).join('')||'暂无单据';}
async function showOrder(kind,id){const d=await api(`/api/${kind}/${id}`);const tot=d.sale_total??d.goods_total;const canShare=kind==='inbound'||d.type==='sale';const canPay=kind==='inbound'||d.type==='sale';const tlabel=d.type==='personal'?'自饮':d.type==='gift'?'赠送':d.type==='damage'?'破损':'';$('order-detail').innerHTML=`<div class="card"><h3>${d.order_no} ${tlabel}</h3><div>${d.items.map(i=>`${i.wine_name} x${i.qty} `+(i.discount_amount?`原价${i.orig_price} 折后${i.unit_price} 折扣${i.discount_amount} 小计${(i.qty*i.unit_price).toFixed(2)}`:`单价${i.unit_price} 小计${(i.qty*i.unit_price).toFixed(2)}`)).join('<br>')}</div><p>${d.type&&d.type!=='sale'?`成本 ¥${d.cost_total||0}（${d.items.reduce((a,i)=>a+i.qty,0)} 瓶）`:`货款 ¥${tot}${d.discount_total?`（其中折扣 ¥${d.discount_total}）`:''}`} · 运费 ¥${d.freight} · 已付 ¥${d.paid_amount} · 状态 ${d.pay_status}</p>${canPay?`<label>补记金额（元）</label><input id="pay-amt" type="number" step="0.01"><button onclick="addPay('${kind}',${id})">补记</button> `:''}${canShare?`<a href="/api/orders/${kind}/${id}/share.png" target="_blank" onclick="showToast('正在生成分享图…')"><button class="ghost">生成分享图</button></a>`:''}</div>`;}
async function addPay(kind,id){try{const amt=+$('pay-amt').value;await api(`/api/orders/${kind}/${id}/payments`,'POST',{amount:amt});showOrder(kind,id);loadOrders(kind);showToast('已补记付款');}catch(e){showToast('失败：'+e.message);}}
let editPartyId=0,editPartyKind='';
async function editParty(kind,id){try{const ps=await api('/api/'+kind);const p=ps.find(x=>x.id===id);if(!p)return;editPartyKind=kind;editPartyId=id;if(kind==='suppliers'){$('s-name').value=p.name||'';$('s-phone').value=p.phone||'';$('s-addr').value=p.address||'';$('s-save-btn').textContent='保存修改';$('s-cancel-btn').classList.remove('hidden');}else{$('c-name').value=p.name||'';$('c-phone').value=p.phone||'';$('c-addr').value=p.address||'';$('c-save-btn').textContent='保存修改';$('c-cancel-btn').classList.remove('hidden');}showToast('正在修改'+p.name);}catch(e){showToast('失败：'+e.message);}}
function cancelEditParty(){editPartyId=0;editPartyKind='';['s-name','s-phone','s-addr','c-name','c-phone','c-addr'].forEach(i=>{$(i).value='';});$('s-save-btn').textContent='新增供应商';$('c-save-btn').textContent='新增客户';$('s-cancel-btn').classList.add('hidden');$('c-cancel-btn').classList.add('hidden');}
async function delParty(kind,id){const label=kind==='suppliers'?'供应商':'客户';if(!confirm('确定删除该'+label+'吗？有单子的不能删。'))return;try{await api('/api/'+kind+'/'+id,'DELETE');showToast('已删除');loadParties(kind);loadFormOptions();}catch(e){showToast('删除失败：'+e.message);}}
async function loadUsers(){const us=await api('/api/users');$('user-list').innerHTML=us.map(x=>`<div class="item"><div><b>${x.username}</b> ${x.display_name||''} ${x.active?'':'<span class="badge warn">已停用</span>'} ${x.must_change_password?'<span class="badge warn">需改密</span>':''} ${x.active?`<button class="ghost" onclick="toggleUser(${x.id},0)">停用</button>`:''}</div></div>`).join('');}
async function toggleUser(id,active){try{await api(`/api/users/${id}`,'PUT',{active});loadUsers();showToast(active?'已启用':'已停用');}catch(e){showToast('失败：'+e.message);}}
async function saveUser(){try{await api('/api/users','POST',{username:$('u-name').value,display_name:$('u-disp').value,password:$('u-pw').value,must_change_password:true});loadUsers();showToast('管理员已新增');}catch(e){showToast('失败：'+e.message);}}
async function loadAudit(){const ls=await api('/api/audit-logs');$('audit-list').innerHTML=ls.map(l=>`<div>${l.created_at} <b>${l.username}</b> ${l.action} ${l.target||''} <span class="muted">${l.note||''}</span></div>`).join('')||'暂无记录';}
async function loadVersion(){try{const r=await fetch('/api/version');const d=await r.json();if(d.version){$('ver').textContent=d.version;const lv=$('login-ver');if(lv)lv.textContent=d.version;}}catch(e){}}
loadVersion();
if(token){$('page-login').classList.add('hidden');$('page-register').classList.add('hidden');enterApp();}else{$('page-login').classList.remove('hidden');loadAuthStatus();}
</script></body></html>
